# =====================================================================
# 서버(호스트) nginx 설정: /etc/nginx/sites-available/allimio
#   외부 1.201.122.5:5174 / :9102  →  minikube 노드(192.168.49.2)의 NodePort로 전달
#   (minikube는 Docker 컨테이너 안에 있어서 NodePort가 서버 외부 IP로는 바로 열리지 않음)
#   유형숲(80) 설정과는 별도 파일이라 서로 영향 없음
# =====================================================================

# ---------- React (allimio-web) ----------
server {
    listen 5174;

    location / {
        proxy_pass http://192.168.49.2:30174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Spring API (allimio-api) ----------
server {
    listen 9102;

    # nginx 기본 업로드 제한은 1MB → Spring 설정(10MB)보다 넉넉하게
    client_max_body_size 20m;

    location / {
        proxy_pass http://192.168.49.2:30902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                       # 쿠키/리다이렉트가 1.201.122.5 기준으로 동작
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 실제 접속자 IP (로그인 이력)
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 답변/요약 등 오래 걸리는 요청 대비 (기본 60초)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
